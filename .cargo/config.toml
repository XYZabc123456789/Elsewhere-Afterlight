[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=/usr/bin/mold",
    "-Clink-arg=-fuse-ld=mold",

    "-Zshare-generics=y",
    "-Zthreads=0",
]
rustdocflags = [
    "-Clink-arg=-fuse-ld=mold",
]

[profile.dev]
codegen-backend = "cranelift"

[profile.dev.package."*"]
codegen-backend = "llvm"

[unstable]
codegen-backend = true